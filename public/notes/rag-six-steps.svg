<svg width="980" height="430" viewBox="0 0 980 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#646772"/>
    </marker>
  </defs>

  <rect width="980" height="430" rx="14" fill="#07090e"/>

  <text x="30" y="44" fill="#94a2ff" font-size="15" font-weight="700">RAG · six steps</text>
  <text x="186" y="44" fill="#646772" font-size="13">— every question makes this round trip</text>

  <!-- Row 1: left to right -->
  <g>
    <rect x="30" y="76" width="270" height="88" rx="8" fill="#0f1117" stroke="#94a2ff" stroke-width="1.5"/>
    <text x="50" y="104" fill="#94a2ff" font-size="12" font-weight="700">01</text>
    <text x="50" y="128" fill="#edf0f8" font-size="15">Question</text>
    <text x="50" y="148" fill="#646772" font-size="12">asked in plain language</text>
  </g>
  <line x1="300" y1="120" x2="349" y2="120" stroke="#646772" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="355" y="76" width="270" height="88" rx="8" fill="#0f1117" stroke="#94a2ff" stroke-width="1.5"/>
    <text x="375" y="104" fill="#94a2ff" font-size="12" font-weight="700">02</text>
    <text x="375" y="128" fill="#edf0f8" font-size="15">Embed the query</text>
    <text x="375" y="148" fill="#646772" font-size="12">meaning becomes a vector</text>
  </g>
  <line x1="625" y1="120" x2="674" y2="120" stroke="#646772" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="680" y="76" width="270" height="88" rx="8" fill="#0f1117" stroke="#94a2ff" stroke-width="1.5"/>
    <text x="700" y="104" fill="#94a2ff" font-size="12" font-weight="700">03</text>
    <text x="700" y="128" fill="#edf0f8" font-size="15">Vector search</text>
    <text x="700" y="148" fill="#646772" font-size="12">nearest documents win</text>
  </g>

  <!-- Wrap down to row 2 -->
  <line x1="815" y1="164" x2="815" y2="240" stroke="#646772" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: right to left -->
  <g>
    <rect x="680" y="246" width="270" height="88" rx="8" fill="#0f1117" stroke="#94a2ff" stroke-width="1.5"/>
    <text x="700" y="274" fill="#94a2ff" font-size="12" font-weight="700">04</text>
    <text x="700" y="298" fill="#edf0f8" font-size="15">Extract the chunks</text>
    <text x="700" y="318" fill="#646772" font-size="12">passages, not whole files</text>
  </g>
  <line x1="680" y1="290" x2="631" y2="290" stroke="#646772" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="355" y="246" width="270" height="88" rx="8" fill="#0f1117" stroke="#94a2ff" stroke-width="1.5"/>
    <text x="375" y="274" fill="#94a2ff" font-size="12" font-weight="700">05</text>
    <text x="375" y="298" fill="#edf0f8" font-size="15">Chunks + question</text>
    <text x="375" y="318" fill="#646772" font-size="12">combined into one prompt</text>
  </g>
  <line x1="355" y1="290" x2="306" y2="290" stroke="#646772" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="30" y="246" width="270" height="88" rx="8" fill="#0f1117" stroke="#5ee6a8" stroke-width="1.5"/>
    <text x="50" y="274" fill="#5ee6a8" font-size="12" font-weight="700">06</text>
    <text x="50" y="298" fill="#edf0f8" font-size="15">Grounded answer</text>
    <text x="50" y="318" fill="#646772" font-size="12">with citations</text>
  </g>

  <text x="30" y="390" fill="#646772" font-size="13">Steps 02–04 are retrieval. Get them wrong and step 06 is confidently wrong too.</text>
</svg>
